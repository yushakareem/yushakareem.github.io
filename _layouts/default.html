<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Set theme before paint to avoid a flash. Default: light.
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div class="page">
    {% include nav.html %}
    <main class="content {% if page.layout == 'post' %}prose{% endif %}">
      {{ content }}
    </main>
    <footer class="footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span class="footer-links">
        <a href="https://github.com/yushakareem">github</a>
        <a href="https://www.linkedin.com/in/s-y-k/">linkedin</a>
        <a href="mailto:syedyusha@gmail.com">email</a>
        <a href="https://scholar.google.nl/citations?hl=nl&amp;user=RoPfjkMAAAAJ">scholar</a>
      </span>
    </footer>
  </div>
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function sync() {
        var dark = root.getAttribute('data-theme') === 'dark';
        var msg = dark ? 'Switch to light theme' : 'Switch to dark theme';
        btn.setAttribute('aria-label', msg);
        btn.setAttribute('title', msg);
      }
      sync();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
    })();
  </script>
  <script>
    // Eyes follow the cursor (home page only; no-op elsewhere).
    (function () {
      var frame = document.querySelector('.portrait-frame');
      if (!frame) return;
      var balls = [].slice.call(document.querySelectorAll('.eyeball'));
      if (!balls.length) return;
      if (!matchMedia('(prefers-reduced-motion: no-preference)').matches
          || !matchMedia('(pointer: fine)').matches) return;
      var MX = 2.2, MY = 1.1;
      function move(e) {
        var r = frame.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height * 0.224;
        var dx = Math.max(-1, Math.min(1, (e.clientX - cx) / (window.innerWidth * 0.5)));
        var dy = Math.max(-1, Math.min(1, (e.clientY - cy) / (window.innerHeight * 0.5)));
        var t = 'translate(' + (dx * MX).toFixed(2) + 'px,' + (dy * MY).toFixed(2) + 'px)';
        balls.forEach(function (b) { b.style.transform = t; });
      }
      function reset() { balls.forEach(function (b) { b.style.transform = ''; }); }
      window.addEventListener('mousemove', move);
      document.addEventListener('mouseleave', reset);
    })();
  </script>
</body>
</html>
