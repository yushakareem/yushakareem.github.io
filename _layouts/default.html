<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    {% include nav.html %}
    <main class="content {% if page.layout == 'post' %}prose{% endif %}">
      {{ content }}
    </main>
    <footer class="footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span><a href="https://github.com/yushakareem">github</a></span>
    </footer>
  </div>
</body>
</html>
