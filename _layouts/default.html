<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Set theme before paint to avoid a flash. Default: light.
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div class="page">
    {% include nav.html %}
    <aside class="rail"></aside>
    <main class="content {% if page.layout == 'post' %}prose{% endif %}">
      {{ content }}
    </main>
    <footer class="footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span class="footer-links">
        <a href="https://github.com/yushakareem">github</a>
        <a href="https://www.linkedin.com/in/s-y-k/">linkedin</a>
        <a href="mailto:syedyusha@gmail.com">email</a>
        <a href="https://scholar.google.nl/citations?hl=nl&amp;user=RoPfjkMAAAAJ">scholar</a>
      </span>
    </footer>
  </div>
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function sync() {
        var dark = root.getAttribute('data-theme') === 'dark';
        var msg = dark ? 'Switch to light theme' : 'Switch to dark theme';
        btn.setAttribute('aria-label', msg);
        btn.setAttribute('title', msg);
      }
      sync();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
    })();
  </script>
  <script>
    // Section rail: a pipeline-style trace of the page. Built from headings /
    // [data-rail] sections; nodes fill in as the reader scrolls past them.
    (function () {
      var rail = document.querySelector('.rail');
      var main = document.querySelector('main.content');
      if (!rail || !main) return;
      var heads = [].slice.call(main.querySelectorAll('h2[id], [data-rail][id]'));
      if (heads.length < 2) { rail.classList.add('rail-empty'); return; }

      var list = document.createElement('ol');
      list.className = 'rail-list';
      var items = heads.map(function (h) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = (h.getAttribute('data-rail') || h.textContent).trim().toLowerCase();
        li.appendChild(a);
        list.appendChild(li);
        return li;
      });
      var nav = document.createElement('nav');
      nav.className = 'rail-nav';
      nav.setAttribute('aria-label', 'On this page');
      var label = document.createElement('p');
      label.className = 'rail-label';
      label.textContent = 'on this page';
      nav.appendChild(label);
      nav.appendChild(list);
      rail.appendChild(nav);

      var ticking = false;
      function update() {
        ticking = false;
        var idx = 0;
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top <= 140) idx = i;
        }
        if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) {
          idx = heads.length - 1;
        }
        items.forEach(function (li, i) {
          li.classList.toggle('is-active', i === idx);
          li.classList.toggle('is-done', i < idx);
        });
        list.style.setProperty('--rail-progress', (items[idx].offsetTop + items[idx].offsetHeight / 2) + 'px');
      }
      function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      update();
    })();
  </script>
  <script>
    // Eyes follow the cursor (home page only; no-op elsewhere).
    (function () {
      var frame = document.querySelector('.portrait-frame');
      if (!frame) return;
      var balls = [].slice.call(document.querySelectorAll('.eyeball'));
      if (!balls.length) return;
      if (!matchMedia('(prefers-reduced-motion: no-preference)').matches
          || !matchMedia('(pointer: fine)').matches) return;
      var MX = 2.2, MY = 1.1;
      function move(e) {
        var r = frame.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height * 0.224;
        // Normalize by the distance to the edge the cursor is heading toward, so
        // the eyes reach full deflection on every side even though the portrait
        // sits off-center (to the left) on the page.
        var denomX = (e.clientX < cx ? cx : window.innerWidth - cx) || 1;
        var denomY = (e.clientY < cy ? cy : window.innerHeight - cy) || 1;
        var dx = Math.max(-1, Math.min(1, (e.clientX - cx) / denomX));
        var dy = Math.max(-1, Math.min(1, (e.clientY - cy) / denomY));
        var t = 'translate(' + (dx * MX).toFixed(2) + 'px,' + (dy * MY).toFixed(2) + 'px)';
        balls.forEach(function (b) { b.style.transform = t; });
      }
      function reset() { balls.forEach(function (b) { b.style.transform = ''; }); }
      window.addEventListener('mousemove', move);
      document.addEventListener('mouseleave', reset);
    })();
  </script>
  <script data-goatcounter="https://yusha-kareem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
